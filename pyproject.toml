[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caseflow"
version = "0.1.0"
description = "Multi-agent workflows as data: published definitions compiled to a LangGraph graph with human review, pinned versions and golden-case evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Baha Kırbaşoğlu" }]
dependencies = ["langgraph>=1.0", "pydantic>=2.6"]

[project.optional-dependencies]
azure = ["openai>=1.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
caseflow = "caseflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caseflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
